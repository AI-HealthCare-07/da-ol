name: Discord Review Notifications

# PR 생성/머지/push 알림은 GitHub 기본 웹훅(디스코드 URL + /github)이 담당하고,
# 이 워크플로는 멘션이 필요한 "리뷰 요청 / 재리뷰 요청 / 리뷰 / 코멘트"만 보냅니다.

on:
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    # issue_comment는 이슈 코멘트도 포함되므로 PR 코멘트만 통과
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_MAP: ${{ vars.DISCORD_USER_MAP }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          SENDER: ${{ github.event.sender.login }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          TEAM: ${{ github.event.requested_team.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_URL: ${{ github.event.review.html_url }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          BODY: ${{ github.event.review.body || github.event.comment.body }}
        run: |
          set -euo pipefail

          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL 시크릿이 설정되지 않았어요."
            exit 1
          fi

          # 봇이 남긴 코멘트/리뷰는 무시
          case "$SENDER" in *"[bot]") echo "bot 이벤트 무시"; exit 0 ;; esac

          # GitHub 아이디 -> 디스코드 유저 ID 매핑
          MAP="${USER_MAP}"
          [ -z "$MAP" ] && MAP='{}'
          mention() {
            local id
            id=$(echo "$MAP" | jq -r --arg u "$1" '.[$u] // empty')
            if [ -n "$id" ]; then echo "<@${id}>"; else echo "$1"; fi
          }

          CONTENT=""
          LINK="$PR_URL"
          SHOW_BODY="false"

          case "$EVENT" in
            pull_request)
              # 리뷰 요청 / 재리뷰 요청
              if [ -n "$REVIEWER" ]; then
                COUNT=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
                  --jq "[.[] | select(.user.login == \"$REVIEWER\")] | length" \
                  | awk '{s+=$1} END {print s+0}')
                TARGET=$(mention "$REVIEWER")
              else
                COUNT=0
                TARGET="팀 ${TEAM}"
              fi

              if [ "$COUNT" -gt 0 ]; then
                TITLE="🔄 재리뷰 요청이 왔어요"
                COLOR=15105570
              else
                TITLE="👀 리뷰 요청이 왔어요"
                COLOR=5763719
              fi
              CONTENT="${TARGET} 님, 리뷰 부탁드려요!"
              HEAD_LINE=$(printf '**#%s %s**\n요청한 사람: %s\n리뷰어: %s' \
                "$PR_NUMBER" "$PR_TITLE" "$SENDER" "${REVIEWER:-$TEAM}")
              ;;

            pull_request_review)
              # 리뷰 제출 (승인 / 변경 요청 / 코멘트)
              case "$REVIEW_STATE" in
                approved)          TITLE="✅ PR이 승인됐어요";          COLOR=5763719 ;;
                changes_requested) TITLE="🛠️ 변경 요청이 들어왔어요";   COLOR=15548997 ;;
                *)                 TITLE="💬 리뷰 코멘트가 달렸어요";   COLOR=10181046 ;;
              esac
              if [ "$SENDER" != "$PR_AUTHOR" ]; then
                CONTENT="$(mention "$PR_AUTHOR") 님, 리뷰가 도착했어요!"
              fi
              LINK="${REVIEW_URL:-$PR_URL}"
              SHOW_BODY="true"
              HEAD_LINE=$(printf '**#%s %s**\n리뷰어: %s' "$PR_NUMBER" "$PR_TITLE" "$SENDER")
              ;;

            issue_comment)
              # PR 대화 탭에 남긴 일반 코멘트
              TITLE="💬 PR에 코멘트가 달렸어요"
              COLOR=10181046
              if [ "$SENDER" != "$PR_AUTHOR" ]; then
                CONTENT="$(mention "$PR_AUTHOR") 님, 새 코멘트가 있어요!"
              fi
              LINK="${COMMENT_URL:-$PR_URL}"
              SHOW_BODY="true"
              HEAD_LINE=$(printf '**#%s %s**\n작성자: %s' "$PR_NUMBER" "$PR_TITLE" "$SENDER")
              ;;

            *)
              echo "처리하지 않는 이벤트: $EVENT"
              exit 0
              ;;
          esac

          jq -n \
            --arg content "$CONTENT" \
            --arg title "$TITLE" \
            --arg url "$LINK" \
            --arg head "$HEAD_LINE" \
            --arg body "$BODY" \
            --arg show "$SHOW_BODY" \
            --argjson color "$COLOR" \
            '
            ($body | gsub("\r"; "")) as $b
            | (if $show == "true" and ($b | length) > 0
                 then "\n\n> " + (($b[0:300]) | gsub("\n"; "\n> "))
                      + (if ($b | length) > 300 then "…" else "" end)
                 else "" end) as $quote
            | {
                username: "다올 GitHub",
                content: $content,
                allowed_mentions: { parse: ["users"] },
                embeds: [{ title: $title, url: $url, description: ($head + $quote), color: $color }]
              }' > payload.json

          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
